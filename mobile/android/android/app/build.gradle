apply plugin: 'com.android.application'

def generatedSidraResources = layout.buildDirectory.dir('generated/res/sidra')
def generatedSidraAssets = layout.buildDirectory.dir('generated/assets/sidra')
def sharedPluginManagerScript = rootProject.file('../../../assets/pluginManager.js')
def sharedMusicKitHook = rootProject.file('../../../assets/musicKitHook.js')
def sharedPluginManagerApp = rootProject.file('../../../assets/plugin-manager')

tasks.register('buildSharedPluginManager', Exec) {
    workingDir rootProject.file('../../..')
    commandLine 'npm', 'run', 'build:plugin-manager'
}

tasks.register('copySidraSharedResources', Copy) {
    dependsOn('buildSharedPluginManager')
    from(sharedPluginManagerScript, sharedMusicKitHook)
    into(generatedSidraResources.map { it.dir('raw') })
    rename { filename ->
        filename == 'pluginManager.js' ? 'plugin_manager.js' : 'music_kit_hook.js'
    }
}

tasks.register('copySidraSharedAssets', Copy) {
    dependsOn('buildSharedPluginManager')
    from(sharedPluginManagerApp)
    into(generatedSidraAssets.map { it.dir('plugin-manager') })
}

android {
    namespace = "world.wimpys.sidra.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "world.wimpys.sidra.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('../keystore.properties')
            if (propsFile.exists()) {
                props.load(propsFile.newDataInputStream())
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : null
        }
    }
    sourceSets {
        main.res.srcDir(generatedSidraResources)
        main.assets.srcDir(generatedSidraAssets)
    }
}

tasks.named('preBuild').configure {
    dependsOn('copySidraSharedResources', 'copySidraSharedAssets')
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
